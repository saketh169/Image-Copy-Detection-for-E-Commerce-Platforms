[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-copy-detection"
version = "1.0.0"
description = "Siamese ConvNeXt image copy detection with calibrated embeddings and centroid HNSW routing"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
