# Final HNSW selections reported in Timing.md.
# Every selection matched direct search on every full-Q query across all 19 attacks.

selection_criteria:
  - exact direct-search agreement on every query
  - low worst-case per-query latency
  - stable mean latency across the tested Q sizes
  - middle-to-large centroid count appropriate to bank size
  - verified speedup without changing the retrieval decision

choices:
  ucid:
    bank_embeddings: 4500
    q_sizes: [100, 200, 400, 500]
    centroids: 256
    overlap: 2
    entries: 1
    degree: 24
    ef: 16
    ef_construction: 96
    speedup_min_avg_max: [2.615, 2.760, 2.829]
